<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timers & Intervals</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Glass Card */
      .glass-card {
        width: 320px;
        padding: 30px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.25);
        text-align: center;
        color: #fff;
      }

      .glass-card h2 {
        margin-bottom: 10px;
      }

      .glass-card p {
        font-size: 14px;
        opacity: 0.85;
      }

      /* Progress Bar */
      .progress-container {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        margin: 20px 0;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00f2fe, #4facfe);
        /* animation: download 6s linear forwards; */
        border-radius: 10px;
        /* transition: width 0.3s ease; */
      }

      /* Percentage */
      .percentage {
        font-size: 18px;
        font-weight: bold;
      }

      /* Animation */
      /* @keyframes download {
        from {
          width: 0%;
        }
        to {
          width: 75%;
        }
      } */
    </style>
  </head>
  <body>
    <div class="glass-card">
      <h2>Downloading File</h2>
      <p>file_name.zip</p>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <span class="percentage">75%</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
